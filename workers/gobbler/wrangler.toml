# The Gobbler worker: realtime rooms for /gobbler.
# Pages deploys the site from git. This Worker is a separate deploy.
# See the pull request description for the route the owner must attach:
#   vacationmath.co/api/gobbler*
#
# Local:
#   npm install
#   npm run dev          # API on http://127.0.0.1:8787
#   node dev-server.mjs  # site + API proxy on http://127.0.0.1:4173/gobbler/
#
# Production:
#   npx wrangler login
#   npx wrangler deploy
# Then add the route above on the vacationmath.co zone. The first deploy
# applies migration v1 and creates the GobblerRoom Durable Object class.

name = "vacationmath-gobbler"
main = "src/index.js"
compatibility_date = "2025-11-01"
workers_dev = true

[[durable_objects.bindings]]
name = "ROOMS"
class_name = "GobblerRoom"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["GobblerRoom"]
