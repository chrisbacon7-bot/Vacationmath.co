    <p class="cg-hook">Mallory menus are a tax. Cuban breakfast, one named dinner, and sunset from the sidewalk.</p>

    <noscript>
      <p class="cg-orient">VacationMath orientation — not live rates</p>
      <h2>When to go</h2>
      <p>Early May and late September–October after the heaviest summer, before winter northbound rates.</p>
      <h2>Top money-saving tips</h2>
      <ol><li>Cuban Coffee Queen or a ventanita breakfast. Mallory Square menus are a tax.</li><li>Sunset from the sidewalk. Skip a paid pier ticket on Lean — the sun does the same work.</li><li>El Siboney or Garbo’s for Lean dinner. Blue Heaven early if leftover covers the wait.</li><li>Stay Old Town. A cheap Stock Island room plus a nightly cab is not Lean.</li><li>Fort Zach beach + fort is the cheap outdoor ticket. Parasail is leftover.</li><li>Dry Tortugas is a full ferry day — only if leftover covers it. Do not stack Tortugas, a sunset sail, and a seaplane in three nights.</li><li>EYW air is a premium. Midweek, or drive from Miami as a priced day, not a surprise.</li><li>Key lime pie once. Happy-hour conch fritters are a snack, not dinner.</li></ol>
