      <h2>When to go</h2>
      <p>Late January through March, and November before the holiday lights become a room tax.</p>
      <h2>Top money-saving tips</h2>
      <ol><li>Bakery breakfast on your block. Du Pain et des Idées class if you slept in the 10th — not the hotel buffet.</li><li>Bouillon Chartier / Pigalle or a formule du midi. Skip restaurants on the tower, the hill, and the museum steps.</li><li>Navigo or a carnet. Taxis are leftover. Pack light — stairs are common.</li><li>Louvre or Orsay — pick one timed ticket. A four-museum day is how you buy souvenirs you will not remember.</li><li>Eiffel from Trocadéro or Champ de Mars on Lean. The summit is a pick-one with Sainte-Chapelle.</li><li>Book the Atlantic crossing 2–4 months out, midweek. Open-jaw (in Paris, out Rome) often beats two one-ways.</li><li>Fromagerie + wine is a valid dinner. Palace-hotel dining only if leftover is silly.</li><li>10th–11th or 18th–19th on a Metro line. A tower-block view is a tourist tax.</li></ol>
