    <p class="cg-hook">Excellent food at every price. The overrun is a rideshare to dinner across the basin.</p>
    <p>Loading the printable brief&hellip;</p>
    <noscript>
      <p class="cg-orient">VacationMath orientation — not live rates</p>
      <h2>When to go</h2>
      <p>Late January through March, and May before Memorial Day if you want beach without June gloom denial.</p>
      <h2>Top money-saving tips</h2>
      <ol><li>Pick one pocket (Downtown, Koreatown, or the beach) and eat there. Crossing the basin for dinner is a second hotel.</li><li>TAP day fares beat a rideshare loop. The Getty is free if you reserve — bus or pay parking, not a $40 drop-off.</li><li>Porto’s or a bakery breakfast. Hotel restaurants in LA are airport-priced.</li><li>Midweek flights into LAX, BUR, or SNA. Friday arrivals are a tax.</li><li>Skip hotel parking unless you have a canyon or beach-hop day already priced.</li><li>Disneyland is Anaheim lodging and a separate ticket. Do not add it as a “quick” day from Santa Monica.</li><li>Grand Central Market and a taco truck (Mariscos Jalisco class) beat a hotel dinner.</li><li>Universal Express is Stretch. Getty + Griffith + one beach day is the Lean week.</li></ol>
