      <h2>When to go</h2>
      <p>January, February, and November — dark, damp, and honestly cheaper.</p>
      <h2>Top money-saving tips</h2>
      <ol><li>Contactless daily cap. You almost never need a paper ticket. A rental car is a Congestion Charge you do not want.</li><li>Premier Inn or Travelodge Zone 1–2 on Lean. Mayfair is leftover — luxury is the room plus £8 pints.</li><li>Bakery or Tesco breakfast. Borough or Maltby lunch. Zone 2 Indian or Turkish dinner, not a West End prix fixe every night.</li><li>British Museum or National Gallery are free. The Eye is a pick-one with the Tower — not both on Lean.</li><li>West End rush / day seats before a full-price orchestra. Stretch is one reserved seat, not three.</li><li>Book the Atlantic 2–4 months out, midweek. Open-jaw with Paris or Dublin often beats two one-ways.</li><li>Skip a paid Eye ticket on Lean — South Bank walk is the product.</li><li>Hotel-included breakfast only if it is actually in the rate. Pret is a fallback, not a personality.</li></ol>
