      <h2>When to go</h2>
      <p>Early May, late September, and early October — after spring break, before winter northbound escape rates.</p>
      <h2>Top money-saving tips</h2>
      <ol><li>Confirm the airport transfer is in the rate. The surprise van is how a value AI stops being value.</li><li>Eat on-property — that is the product. One downtown taco night only if the transfer is cheap.</li><li>Skip the timeshare-day “free” excursion. It is a half-day tax.</li><li>Do not buy bottled water you already paid for at a dock kiosk.</li><li>Isla Mujeres ferry or one cenote — pick one ticketed day. Beach days are the rest.</li><li>Chichén Itzá is a long day. Only with a trusted tour if leftover covers it.</li><li>Hurricane-season deals need a cancel stance. Shoulder May is the heat-for-value trade without the storm math.</li><li>Garden view on purpose. Ocean-view and swim-up upsells are leftover, not Lean.</li></ol>
