    <noscript>
      <p class="cg-orient">VacationMath orientation — not live rates</p>
      <h2>When to go</h2>
      <p>Late January through March, and November before the holiday nativity crowds.</p>
      <h2>Top money-saving tips</h2>
      <ol><li>Cornetto and coffee standing at the bar. The hotel breakfast is a tourist menu with orange juice.</li><li>Trastevere or Testaccio dinner. Skip the photo-menu restaurant on Piazza Navona.</li><li>Coperto is a line item, not a scam. Budget it. Bread you did not order can be too.</li><li>Colosseum + Forum timed, or Vatican Museums — pick a pace. Do not stack three ticketed interiors in one day.</li><li>Golf-cart forum tours are leftover. Daylight centro walks are Lean.</li><li>Midweek FCO, 2–4 months out. Open-jaw with Paris or Venice often beats a backtrack.</li><li>Prati near Ottaviano if the centro is sold out — Metro to the Vatican, calmer nights.</li><li>La Pergola is leftover. Roscioli-adjacent or a Testaccio trattoria is Solid.</li></ol>
