      <h2>When to go</h2>
      <p>Late January after bowl season, and May before the heaviest heat if you missed Jazz Fest on purpose.</p>
      <h2>Top money-saving tips</h2>
      <ol><li>Cut the hotel class before you cut Galatoire’s or Commander’s. This is a food trip.</li><li>Warehouse District, Mid-City, or Garden District. French Quarter room premium is real and not the plate.</li><li>Café du Monde once. Then a neighborhood café — not a Bourbon breakfast every morning.</li><li>Po’boy lunch (Parkway or a neighborhood shop). One old-school dinner, not a tourist-menu courtyard every night.</li><li>Streetcar day pass. A rental car is a parking fee you will resent.</li><li>Mardi Gras is a different budget — rooms, throw-away clothes, and surge. Do not “just happen” to overlap it.</li><li>Hurricane-season weeks need a cancel stance you already priced. The music will still be there in January.</li><li>Haunted tours are leftover. Daylight Quarter walks and a streetcar hour are Lean.</li></ol>
