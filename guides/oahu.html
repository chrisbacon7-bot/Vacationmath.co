    <h1 class="cg-h1">Oahu</h1>
    <p class="cg-hook">Waikiki bus grid. Resort breakfast every morning is how mainland prices follow you across the Pacific.</p>
    <p>Loading the printable brief&hellip;</p>
    <noscript>
      <p class="cg-orient">VacationMath orientation — not live rates</p>
      <h2>When to go</h2>
      <p>May and September–early October — after spring break, before winter northbound rates.</p>
      <h2>Top money-saving tips</h2>
      <ol><li>Grocery the condo or a plate-lunch breakfast. Resort breakfast every day is mainland prices plus a view surcharge.</li><li>Skip the car if you will stay on the Waikiki bus grid. Parking is $40–55/night.</li><li>Plate lunch (Rainbow Drive-In / L&amp;L class) and poke. Leonard’s malasadas once, not as a meal.</li><li>Hanauma Bay is reserved and ticketed. Pearl Harbor is one somber morning — not a beach day.</li><li>Midweek HNL from the West Coast. East Coast origins pay a red-eye or a fare — price both.</li><li>A neighbor-island hop is a second ticket. Do not stack Maui into five Oahu nights without a second fare.</li><li>May and September are the value window. Winter holidays are priced like a souvenir.</li><li>Kahala or Ko Olina is leftover and usually a car. Halekulani is Waikiki luxury if you refuse to leave the grid.</li></ol>
      <p><a href="/plan?dest=oahu">Build a hard-budget plan</a></p>
