    <p class="cg-hook">The L beats surge pricing. Winter rates are the value window; summer weekends are not.</p>
    <p>Loading the printable brief&hellip;</p>
    <noscript>
      <p class="cg-orient">VacationMath orientation — not live rates</p>
      <h2>When to go</h2>
      <p>January through early March for rooms; late April and September if you want walking weather without Taste-of-Chicago rates.</p>
      <h2>Top money-saving tips</h2>
      <ol><li>Ventra day pass beats a rideshare loop. The L is the plan — Mag Mile hotels are for people who will not take it.</li><li>Winter rates are the value window. Summer weekends and Lolla week are not.</li><li>Doughnut or diner breakfast. Downtown hotel restaurants are Chicago-priced for the same eggs.</li><li>One deep-dish if you must, then stop. Italian beef or a Fulton Market casual is the rest of the week.</li><li>Architecture from the sidewalk is free. A river cruise is one ticketed leftover, not a daily habit.</li><li>Art Institute or a river cruise — pick one on Solid. Do not stack two museums and a cruise.</li><li>Midweek ORD or MDW. Friday into a holiday weekend is a different room.</li><li>Fulton Market lodging if you want restaurants over the Mag Mile. One neighborhood, not two towers.</li></ol>
