    <h1 class="cg-h1">Philadelphia</h1>
    <p class="cg-hook">Reading Terminal is the cheap-rich lunch. Cheesesteak is one meal, not a pilgrimage.</p>
    <p>Loading the printable brief&hellip;</p>
    <noscript>
      <p class="cg-orient">VacationMath orientation — not live rates</p>
      <h2>When to go</h2>
      <p>February, early March, and late January after the holiday hangover.</p>
      <h2>Top money-saving tips</h2>
      <ol><li>Independence Hall timed entry is the ticket — book it. The Bell is a line, not a morning.</li><li>Reading Terminal breakfast and lunch. Hotel restaurants are the expensive version of the same plate.</li><li>One cheesesteak, then stop. Roast pork (DiNic’s class) is the local argument.</li><li>SEPTA day pass beats a rideshare loop. Skip the hop-on bus on Lean.</li><li>Barnes or PMA — pick one on Solid. Do not stack three interiors and a cheesesteak tour in one day.</li><li>Midweek PHL. Fourth of July week is a different city and a different room.</li><li>Stay Center City or Old City. An airport hotel is a SEPTA tax you will resent.</li><li>Zahav is leftover. Terminal leftovers plus one neighborhood Italian is Solid.</li></ol>
