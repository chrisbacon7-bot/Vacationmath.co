      <h2>When to go</h2>
      <p>Midweek in January, February, and early December — after the holiday parties, before March conventions.</p>
      <h2>Top money-saving tips</h2>
      <ol><li>Book Tuesday–Thursday. Weekend and holiday weeks double a midweek rate before you add the resort fee.</li><li>Resort fees apply even on a $40 Tuesday. Add them in your head before you celebrate the “deal.”</li><li>Food halls (Park MGM / Cosmo) or Chinatown / Downtown dinner. Strip steakhouses price like airports.</li><li>Walk the Center-Strip. The monorail is a backup; Ubering from bed to the next casino is a habit.</li><li>Fountains, Bellagio conservatory, and a Fremont walk are free. A nightclub table is Stretch, not mid.</li><li>One show, not three. Cirque or a residency leftover — the street is already a show.</li><li>Pay-as-you-go drinks until you run the math. Free drinks are not a meal plan.</li><li>Downtown (Circa-adjacent / Fremont) is Lean lodging if you will walk those lights and rideshare to the Strip once.</li></ol>
