    <h1 class="cg-h1">New York City</h1>
    <p class="cg-hook">The subway is the plan. Midtown is the expensive version of everything — including a $28 salad.</p>
    <p>Loading the printable brief&hellip;</p>
    <noscript>
      <p class="cg-orient">VacationMath orientation — not live rates</p>
      <h2>When to go</h2>
      <p>February, early March, and the back half of January after New Year’s.</p>
      <h2>Top money-saving tips</h2>
      <ol><li>Skip a Times Square hotel unless you like paying for the neon. Pod / citizenM / a Brooklyn train-stop room is Lean.</li><li>Bodega egg-and-cheese or a bakery breakfast. The hotel dining room is a Midtown salad with a room-service tax.</li><li>A 7-day unlimited or OMNY cap beats a week of single swipes if you ride twice a day.</li><li>Staten Island Ferry is the free skyline. Skip a paid harbor loop on Lean.</li><li>One museum with pay-what-you-wish or a timed free night. Do not stack three observatories.</li><li>Midweek flights. Friday into a holiday weekend is the expensive version of the same seat.</li><li>Jackson Heights, Flushing, and Chinatown over Midtown for dinner. One borough per night.</li><li>Broadway rush / lottery before a full-price orchestra. Stretch is a reserved seat, not three shows.</li></ol>
