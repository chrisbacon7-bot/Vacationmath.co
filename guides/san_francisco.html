    <h1 class="cg-h1">San Francisco</h1>
    <p class="cg-hook">Transit-first city. Union Square tourist hotels are the expensive version of a Muni pass.</p>
    <p>Loading the printable brief&hellip;</p>
    <noscript>
      <p class="cg-orient">VacationMath orientation — not live rates</p>
      <h2>When to go</h2>
      <p>Late January, February, and September after Labor Day — September weather often beats July.</p>
      <h2>Top money-saving tips</h2>
      <ol><li>Clipper + Muni / BART. A visitor passport beats a week of single rides if you move.</li><li>Tartine or a Mission bakery breakfast. Skip the hotel dining room and the Wharf seafood rack.</li><li>Alcatraz timed ferry — book ahead. Do not stack Alcatraz, Napa, and Yosemite in five nights.</li><li>Skip the paid cable-car loop if a bus reaches the same hill. The souvenir ride is one ticket, not a commute.</li><li>Napa is a day trip with a packed lunch, not a dinner transfer and a second hotel.</li><li>Midweek SFO. Weekend rates around conventions and Fleet Week are a different city.</li><li>Golden Gate + Crissy Field + Mission murals are free. SFMOMA is one ticketed indoor, not three.</li><li>Union Square tourist hotels are a tax. Embarcadero or a neighborhood 3-star is the Solid stay.</li></ol>
