    <h1 class="cg-h1">Tokyo</h1>
    <p class="cg-hook">Tokyo can be cheap if you let it. Convenience-store breakfast is not a compromise — hotel breakfast is.</p>
    <p>Loading the printable brief&hellip;</p>
    <noscript>
      <p class="cg-orient">VacationMath orientation — not live rates</p>
      <h2>When to go</h2>
      <p>Late January through early March (before peak blossom weekends), and June if you accept rain for rooms.</p>
      <h2>Top money-saving tips</h2>
      <ol><li>Convenience-store onigiri and coffee for breakfast. Hotel buffets are the expensive path.</li><li>A JR Pass is usually a bad buy on a 5-night city trip. IC card + Metro is the plan.</li><li>APA / Super Hotel / Toyoko Inn next to a station on Lean. Capsule only if you packed a cube.</li><li>Conveyor sushi and ramen are Solid lunches. Book one sushi counter if leftover is real — before you land.</li><li>Skip Golden Week and peak blossom weekends unless that is the trip. Late January is the value window.</li><li>Yanaka or Shimokitazawa mornings are free. teamLab or a tower is one ticketed indoor.</li><li>Kyoto is a different trip. Do not fake it as a Tokyo day.</li><li>The room or the counter, rarely both. Park Hyatt views still end with a Metro ride to dinner.</li></ol>
      <p><a href="/plan?dest=tokyo">Build a hard-budget plan</a></p>
