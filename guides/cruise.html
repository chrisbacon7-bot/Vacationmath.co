    <p class="cg-hook">The fare includes the dining room. Specialty, drinks, and the dock kiosk are the trap.</p>

    <noscript>
      <p class="cg-orient">VacationMath orientation — not live rates</p>
      <h2>When to go</h2>
      <p>Early May, early September, and late October–early November — after spring break, before holiday sailings.</p>
      <h2>Top money-saving tips</h2>
      <ol><li>Run the drink-package break-even before you tap yes. À-la-carte wins if you are not a five-drink day.</li><li>Interior or obstructed oceanview on Lean. You bought the itinerary and the deck, not the porthole.</li><li>Main dining room every night on Lean. One specialty night only if leftover covers it.</li><li>One independent port walk plus one ship excursion — not three dock tours.</li><li>Automatic gratuities are a line (age 2+). They are not optional math and they are not buried in the fare.</li><li>Shoulder weeks (early May, early September) cut the cabin and the air to Florida ports.</li><li>Kids soda is often the only package that wins on a short sailing. The latte habit is not a package.</li><li>Room-service fees add up — backup, not breakfast. The buffet is already in the fare.</li></ol>
